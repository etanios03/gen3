$schema: http://json-schema.org/draft-04/schema#
id: treatment_cycle
title: treatment_cycle
type: object
namespace: http://localhost/
category: clinical
program: '*'
project: '*'
description: A single cycle of RPT treatment, including radiopharmaceutical administered
  and activity delivered
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- node_id
- case_ids
- cycle_number
- submitter_id
- type
links:
- name: patient_infos
  backref: treatment_cycles
  label: part_of
  target_type: patient_info
  multiplicity: many_to_one
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  node_id:
    type: string
    description: Node ID of the node in the data model
  case_ids:
    type: array
    items:
      type: string
    description: A list of one or more case submitter_ids associated with the data
  cycle_number:
    type: integer
    description: The sequential number of this treatment cycle
  radiopharmaceutical:
    type: string
    description: Name of the radiopharmaceutical administered, e.g. [177Lu]Lu-DOTATATE
  therapy_type:
    description: Type of ionizing radiation delivered by the radiopharmaceutical
    enum:
    - alpha
    - beta
    - auger
    - other
  net_injected_activity:
    type: number
    description: Net activity injected during this treatment cycle, in MBq
  therapeutic_target:
    type: string
    description: Intended molecular or anatomical therapeutic target, e.g. SSTR2
  pre_SSTR_PET:
    type: number
    description: For NET applications, somatostatin receptor density on NETs before
      treatment
  post_SSTR_PET:
    type: number
    description: For NET applications, somatostatin receptor density on NETs after
      treatment
  pre_chromograninA:
    type: number
    description: For NET applications, CgA protein level pre-treatment, a marker for
      NET tumors
  post_chromograninA:
    type: number
    description: For NET applications, CgA protein level post-treatment, a marker
      for NET tumors
  overall_survival:
    type: number
    description: Length of time from diagnosis or start of treatment until death from
      any cause
  patient_infos:
    $ref: _definitions.yaml#/to_one
additionalProperties: false

  project_id:
    term:
      description: 'Unique ID for any specific defined piece of work that is undertaken
        or attempted to meet a single requirement.

        '
    type: string
  pulmonary_function_test:
    description: An indicator confirming whether a pulmonary function test was performed.
    enum:
    - 'Yes'
    - 'No'
    - Not Reported
  six_minute_walk_test:
    description: An indicator confirming whether the patient completed the 6 Minute
      Walk Test (6MWT).
    enum:
    - 'Yes'
    - 'No'
    - Not Reported
  state:
    default: validated
    downloadable:
    - uploaded
    - md5summed
    - validating
    - validated
    - error
    - invalid
    - released
    oneOf:
    - enum:
      - uploading
      - uploaded
      - md5summing
      - md5summed
      - validating
      - error
      - invalid
      - suppressed
      - redacted
      - live
    - enum:
      - validated
      - submitted
      - released
    public:
    - live
    term:
      description: 'The current state of the object.

        '
  submitter_id:
    description: A human-readable, unique identifier for a record in the metadata
      database. It can be used in place of the UUID for identifying or recalling a
      record (e.g., in data queries or uploads/exports).
    type: string
  test_days_from_index:
    description: A number of days beginning with the index date and ending with the
      date of the test.
    type: integer
  test_method:
    enum:
    - RT-PCR
    - Rapid antigen test
    - Not Reported
    term:
      description: 'The test method used to confirm a condition or produce a measurement.

        '
      termDef:
        cde_id: C82535
        cde_version: null
        source: NCIt
        term: Test Method
        term_url: https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI_Thesaurus&version=24.07e&ns=ncit&code=C82535
  test_name:
    enum:
    - COVID-19
    - FVC (L)
    - FEV1 (L)
    - 6-Minute Walk Test Distance
    - 6-Minute Walk Test Exertional Drop in O2 (%)
    - Oxygenation (SpO2)
    - Home Oxygen Quantity
    term:
      description: 'The name of the test for which this measurement was the result.

        '
      termDef:
        cde_id: C82541
        cde_version: null
        source: NCIt
        term: Test Name
        term_url: https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI_Thesaurus&version=24.07e&ns=ncit&code=C82541
  test_result_number:
    description: The result a test represented by a number.
    type: number
  test_result_percent:
    description: The result a test represented by a percent.
    type: number
  test_result_ratio:
    description: The result a test represented by a ratio.
    type: number
  test_result_text:
    enum:
    - Indeterminate
    - Negative
    - Positive
    - Not Reported
    term:
      description: 'The measured result of the test described using a list of enumerations.

        '
      termDef:
        cde_id: C77140
        cde_version: null
        source: NCIt
        term: Clinical Test Result
        term_url: :https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI_Thesaurus&version=24.07e&ns=ncit&code=C77140
  type:
    description: The node_id of the node in the data model; the name of the node used
      in queries and API requests (e.g., "aligned_reads_file" for the "Aligned Reads
      File" node).
    type: string
  updated_datetime:
    oneOf:
    - format: date-time
      type: string
    - type: 'null'
    term:
      description: 'A combination of date and time of day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]

        '
  model_version:
    type: string
    description: Version of the submitting theranostics extension, independently of
      the MIDRC baseline version.
  record_status:
    type: string
    description: Record curation state, independent of clinical value.
    enum:
    - draft
    - reviewed
    - approved
    - superseded
    - withdrawn
  source_record_id:
    type: string
    description: Identifier of the originating source record; use an approved pseudonym
      when needed.
  source_system:
    type: string
    description: Source system or data provider.
  missing_properties:
    type: array
    description: Names of properties missing from this record; no missing value is
      encoded as zero.
    items:
      type: string
  missing_reasons:
    type: array
    description: Reasons corresponding by index to missing_properties.
    items:
      enum:
      - unknown
      - not_collected
      - not_applicable
      - not_available
      - withheld
      - pending
  test_name_source_value:
    type: string
    description: Name of the measured laboratory analyte. Source field catalog and
      external dictionary define analyte-specific semantics.
  test_method_source_value:
    enum:
    - RT-PCR
    - Rapid antigen test
    - Not Reported
    term:
      description: 'The test method used to confirm a condition or produce a measurement.

        '
      termDef:
        cde_id: C82535
        cde_version: null
        source: NCIt
        term: Test Method
        term_url: https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI_Thesaurus&version=24.07e&ns=ncit&code=C82535
  test_result_source_value:
    enum:
    - Indeterminate
    - Negative
    - Positive
    - Not Reported
    term:
      description: 'The measured result of the test described using a list of enumerations.

        '
      termDef:
        cde_id: C77140
        cde_version: null
        source: NCIt
        term: Clinical Test Result
        term_url: :https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI_Thesaurus&version=24.07e&ns=ncit&code=C77140
  unit:
    type: string
    description: Unit of the numeric test result. Use UCUM when validated.
  unit_source_value:
    type: string
    description: Original unit before harmonization.
  test_code:
    type: string
    description: Approved external analyte code such as LOINC, if mapped.
  test_code_system:
    type: string
    description: Code system for test_code.
  test_code_version:
    type: string
    description: Vocabulary release.
  result_status:
    type: string
    description: Status such as final, preliminary or corrected.
  specimen_type:
    type: string
    description: Specimen type when no specimen record is available.
  result_operator:
    type: string
    description: Comparator such as <, <=, =, >= or >.
  derived_formula:
    type: string
    description: Formula for eGFR or creatinine clearance, when applicable.
  reference_range_low:
    type: number
    description: Reference limit in the same unit as the reported test result.
  reference_range_high:
    type: number
    description: Reference limit in the same unit as the reported test result.
  source_element_id:
    type: string
    description: Field identifier from source_field_catalog.json; identifies source
      analyte definition.
  measurement_date:
    type: string
    format: date
    description: Date the ROI measurement was performed.
  measurement_profile:
    type: string
    description: Theranostics collection profile for an atomic measurement.
    enum:
    - laboratory
    - roi
    - anthropometric
    - biomarker
    - other
  measurement_datetime:
    type: string
    description: Time of specimen collection or measurement; retain actual/shifted/relative-only
      basis.
    format: date-time
  days_from_course_start:
    type: number
    description: Elapsed days from the explicitly linked therapy-course start; distinct
      from MIDRC index-event time.

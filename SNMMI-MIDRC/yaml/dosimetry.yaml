    term:
      description: 'The current state of the object.

        '
  created_datetime:
    oneOf:
    - format: date-time
      type: string
    - type: 'null'
    term:
      description: 'A combination of date and time of day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]

        '
  updated_datetime:
    oneOf:
    - format: date-time
      type: string
    - type: 'null'
    term:
      description: 'A combination of date and time of day in the form [-]CCYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]


  record_status:
    type: string
    description: Record curation state, independent of clinical value.
    enum:
    - draft
    - reviewed
    - approved
    - superseded
    - withdrawn
  source_record_id:
    type: string
    description: Identifier of the originating source record; use an approved pseudonym

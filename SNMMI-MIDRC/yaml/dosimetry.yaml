$schema: http://json-schema.org/draft-04/schema#
id: dosimetry
title: Dosimetry
type: object
namespace: urn:nmmi:lu177-psma:model
category: analysis
program: '*'
project: '*'
description: Dosimetry computation with inputs, integration method, mass model, uncertainty

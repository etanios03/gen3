  source_system:
    type: string
    description: Source system or data provider.
  missing_properties:
    type: array
    description: Names of properties missing from this record; no missing value is
      encoded as zero.
    items:
      type: string
  missing_reasons:
    type: array
    description: Reasons corresponding by index to missing_properties.
    items:
      enum:
      - unknown
      - not_collected
      - not_applicable
      - not_available
      - withheld
      - pending
  method:
    type: string
    description: Dosimetry method.
  software_name:
    type: string
    description: Dosimetry software name.
  software_version:
    type: string
    description: Dosimetry software version.
  mass_model:
    type: string
    description: Dosimetry mass model.
  model_assumptions:
    type: string
    description: Dosimetry model assumptions.
  uncertainty_method:
    type: string
    description: Dosimetry uncertainty method.
  calculation_datetime:
    type: string
    description: Calculation timestamp.
    format: date-time
  dosimetry_ad_calculation_granularity:
    type: integer
    description: Specifies the level of detail for dosimetry computation, such as
      voxel-based or organ-based.
  dosimetry_ad_calculation_method:
    type: integer
    description: The class of computational method used to calculate absorbed dose
      to regions of interest.
  dosimetry_ad_tiac_fitting_method_for_roi:
    type: integer
    description: The type of curve fitting that is applied to calculate the time-integrated
      activity curve for a given ROI.
  dosimetry_software:
    type: string
    description: The software or library used to calculate absorbed dose values for
      dosimetry.
  dosimetry_software_version:
    type: string
    description: The version of the software or library used to calculate absorbed
      dose values for dosimetry.
  dosimetry_imaging_modality:
    type: integer
    description: Imaging modality used for dosimetry (e.g., SPECT/CT, scintigraphy).
  dosimetry_performed:
    type: boolean
    description: Indicates if dosimetry calculations were performed for this patient.
  dosimetry_timepoints:
    type: string
    description: Timepoints post-injection when dosimetry imaging was acquired.
  equivalent_dose:
    type: string
    description: Accounts for the different biological effects of various types of
      radiation. Measured in sieverts (Sv) or rem
  effective_dose:
    type: string
    description: Considers the radiation sensitivity of different tissues and organs,
      providing an overall risk estimate. Measured in sieverts (Sv).
  kerma:
    type: string
    description: Kinetic energy released in matter per unit mass. Measured in grays
      (Gy)

              term_url: https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI_Thesaurus&version=16.02d&ns=NCI_Thesaurus&code=C54100
          type: string
      oneOf:
      - required:
        - submitter_id
      - required:
        - id
    uniqueItems: true
    description: Link to scanner_qa records by submitter_id or UUID.
  provenance_records:
    type: array
    items:
      type: object

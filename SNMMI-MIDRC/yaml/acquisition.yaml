    description: Link to provenance records by submitter_id or UUID.
  model_version:
    type: string
    description: Version of the submitting theranostics extension, independently of
      the MIDRC baseline version.
  record_status:
    type: string
    description: Record curation state, independent of clinical value.
    enum:
    - draft
    - reviewed
    - approved
    - superseded
    - withdrawn
  source_record_id:
    type: string
    description: Identifier of the originating source record; use an approved pseudonym
      when needed.
  source_system:
    type: string
    description: Source system or data provider.
  missing_properties:
    type: array
    description: Names of properties missing from this record; no missing value is
      encoded as zero.
    items:
      type: string
  missing_reasons:
    type: array
    description: Reasons corresponding by index to missing_properties.
    items:
      enum:
      - unknown
      - not_collected
      - not_applicable
      - not_available
      - withheld
      - pending
  protocol_name:
    type: string
    description: Acquisition protocol name.
  duration_seconds:
    type: number
    description: Acquisition duration.
    minimum: 0
  energy_window_names:
    type: array
    description: Ordered energy-window labels.
    items:
      type: string
  energy_window_lower_kev:
    type: array
    description: Ordered energy-window limits in keV.
    items:
      type: number
      minimum: 0
  energy_window_upper_kev:
    type: array
    description: Ordered energy-window limits in keV.
    items:
      type: number
      minimum: 0
  number_of_energy_windows:
    type: integer
    description: Number of windows; equals length of all window arrays.
    minimum: 1
  number_of_bed_positions:
    type: integer
    description: Number of bed positions.
    minimum: 1
  number_of_spect_acquisition_projections:
    type: integer
    description: The total number of projections acquired during the SPECT acquisition.
  imaging_spect_detector_type:
    type: string
    description: The scintillating material used by the gamma camera to detect photons.
  imaging_spect_image_comments:
    type: string
    description: A free-text field allowing any relevant comments or annotations about
      the acquisition; can contain information about acquisition and reconstruction
      settings.
  spiral_pitch_factor:
    type: number
    description: Provisional field for Spiral Pitch Factor; operational definition
      requires review.
  mas_exposure:
    type: number
    description: Provisional field for mAs (exposure); operational definition requires

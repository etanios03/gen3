              Its relatively small size lends itself well to sorting, ordering, and
              hashing of all sorts, storing in databases, simple allocation, and ease
              of programming in general.

              '
            termDef:
              cde_id: C54100
              cde_version: null
              source: NCIt
              term: Universally Unique Identifier
              term_url: https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI_Thesaurus&version=16.02d&ns=NCI_Thesaurus&code=C54100
          type: string
      oneOf:
      - required:
        - submitter_id
      - required:
        - id
    uniqueItems: true
    description: Link to scanner records by submitter_id or UUID.
    minItems: 1
    maxItems: 1
  scanner_qas:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        submitter_id:
          type: string
          minLength: 1
        id:

  x_ray_tube_current:
    type: number
    description: X-Ray Tube Current in mA.
  exposure:
    type: number
    description: The exposure expressed in mAs, for example calculated from Exposure
      Time and X-Ray Tube Current.
  ctdivol:
    type: number
    description: Computed Tomography Dose Index (CTDIvol), in mGy according to IEC
      60601-2-44, Ed.2.1 (Clause 29.1.103.4), The Volume CTDIvol. It describes the
      average dose for this image for the selected CT conditions of operation.
  ctdi_phantom_type_code_sequence:

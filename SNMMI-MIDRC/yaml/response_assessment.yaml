  model_version:
    type: string
    description: Version of the submitting theranostics extension, independently of
      the MIDRC baseline version.
  record_status:
    type: string
    description: Record curation state, independent of clinical value.
    enum:
    - draft
    - reviewed
    - approved
    - superseded
    - withdrawn
  source_record_id:
    type: string
    description: Identifier of the originating source record; use an approved pseudonym
      when needed.
  source_system:
    type: string
    description: Source system or data provider.
  missing_properties:
    type: array
    description: Names of properties missing from this record; no missing value is
      encoded as zero.
    items:
      type: string
  missing_reasons:
    type: array
    description: Reasons corresponding by index to missing_properties.
    items:
      enum:
      - unknown
      - not_collected
      - not_applicable
      - not_available
      - withheld
      - pending
  assessment_datetime:
    type: string
    description: ISO 8601 assessment datetime; use approved date shifting consistently
      within the case.
    format: date-time
  days_from_course_start:
    type: number
    description: Signed elapsed days from the linked therapy course start.
  time_basis:
    type: string
    description: Interpretation of stored dates and elapsed times.
    enum:
    - actual
    - shifted
    - relative_only
    - unknown
  time_window_start_day:
    type: number
    description: Beginning of assessment window relative to course start, in days.
  time_window_end_day:
    type: number
    description: End of assessment window relative to course start, in days.
  criteria_name:
    type: string
    description: Response criteria name.
  criteria_version:
    type: string
    description: Response criteria version.
  assessment_scope:
    type: string
    description: Response assessment scope.
  baseline_definition:
    type: string
    description: Response baseline definition.
  result_category:
    type: string
    description: Response result category.
  baseline_date:
    type: string
    description: Baseline assessment date.
    format: date
  confirmation_date:
    type: string
    description: Confirmation assessment date, if required by criteria.
    format: date
  clinical_progression_date:
    type: string
    format: date
    description: Date when clinical progression (e.g., worsening symptoms, need for
      new therapy) was documented.
  date_of_best_psa_response:
    type: string
    format: date
    description: Date when the best PSA response was documented.
  date_of_radiographic_progression:
    type: string
    format: date
    description: Date when radiographic progression was first documented.
  date_of_radiographic_response_assessment:
    type: string
    format: date
    description: Date when the overall radiographic response was assessed.
  radiographic_response_assessment:
    type: string
    description: Response (image-based)
  imaging_response_assessment_criteria:
    type: string
    description: Provisional field for Imaging_Response_Assessment_Criteria; operational
      definition requires review.
  psa_baseline_definition:
    type: string
    description: Specifies the timepoint convention used to define the baseline PSA
      value. Required to ensure reproducibility of PCWG3-based PSA response and progression
      calculations across institutions.
  psa_baseline_date:
    type: string
    description: Date on which the baseline PSA sample was collected, as defined by
      PSA_Baseline_Definition.
    format: date
  psa_response_category:
    type: string
    description: 'Categorical PSA response based on predefined criteria (e.g., PCWG3:
      >=50% decline).'
  psa_progression_confirmation:
    type: string
    description: PSA Progression (Yes/No) confirmed > 3 weeks later
  radiographic_response_criteria:
    type: string
    description: Criteria used for assessing radiographic response.
  radiographic_response_overall:
    type: string
    description: Overall radiographic response assessment.
  psa_nadir_date:
    type: string
    format: date
    description: Date on which the PSA nadir was recorded.
  psa_response_50_confirmed:
    type: boolean
    description: Indicates whether a confirmed ≥50% decline in PSA from baseline was
      achieved at any point during therapy. Confirmation requires a second value at
      least 3 weeks later. Per PCWG3.
  psa_response_50_date:
    type: string
    format: date
    description: Date on which the ≥50% PSA decline from baseline was first documented
      (not the confirmation date).
  psa_best_response_percent:
    type: number
    description: Minimum signed 100 × (PSA at assessment − baseline PSA) / baseline
      PSA over the declared window when best response means greatest decline. Negative
      is decline. Specify selection rule; omit if baseline is zero.
  psa_early_rise_pre12w:
    type: boolean
    description: Whether an early PSA rise was observed; this does not classify it
      as flare or exclude true progression.
  psa_progression_pcwg3_documented:
    type: boolean
    description: 'Indicates whether PSA progression per PCWG3 criteria has been documented:
      ≥25% increase AND ≥2 ng/mL above nadir (after prior decline), or ≥25% AND ≥2
      ng/mL above baseline (no prior decline beyond 12 weeks), confirmed ≥3 weeks
      later.'
  psa_progression_pcwg3_date:
    type: string
    format: date
    description: Date of first PSA value meeting PCWG3 progression criteria (not the
      confirmation date). Per PCWG3, this date does not necessarily indicate clinical
      need to discontinue therapy.
  psa_progression_pcwg3_confirmed_date:
    type: string
    format: date
    description: Date of the confirmatory PSA value (≥3 weeks after PSA_Progression_PCWG3_Date)
      establishing definitive PCWG3 PSA progression.
  psa_progression_criteria_used:
    type: string
    description: Specifies the PSA progression criteria applied, to enable harmonization
      across datasets with different conventions.
  imaging_response_criteria_used:
    type: string
    description: Specifies the imaging response/progression criteria applied for this
      patient or study.
  imaging_overall_response:
    type: string
    description: Overall radiographic response assessment across all sites at best
      response timepoint.
  imaging_overall_response_date:
    type: string
    format: date
    description: Date on which the overall radiographic response assessment was performed.
  imaging_progression_type:
    type: string
    description: Characterizes the nature of radiographic progression per PCWG3, distinguishing
      growth of pre-existing lesions from development of new lesions, as these carry
      distinct prognostic and biological implications.
  imaging_progression_site:
    type: array
    items:
      type: string
    description: Anatomical site(s) at which radiographic progression was first documented,
      recorded separately per site per PCWG3.
  imaging_progression_date:
    type: string
    format: date
    description: Date of first documented radiographic progression at any site (earliest
      site-specific progression date).
  soft_tissue_response_recist:
    type: string
    description: Best overall response in measurable soft tissue disease (nodal and/or
      visceral) per RECIST 1.1, recorded separately from bone disease per PCWG3.
  nodal_progression_pcwg3:
    type: boolean
    description: Indicates whether nodal progression per PCWG3 criteria has been documented.
      Previously normal nodes (<1.0 cm) must have grown ≥5 mm in short axis AND be
      ≥1.0 cm in short axis. For existing pathologic nodes (≥1.5 cm), progression
      defined per RECIST 1.1.
  nodal_progression_date:
    type: string
    format: date
    description: Date on which nodal progression per PCWG3 criteria was first documented.
  nodal_progression_location:
    type: string
    description: Location of progressive nodal disease, recorded separately per PCWG3
      as locoregional versus metastatic.
  visceral_progression_pcwg3:
    type: boolean
    description: Indicates whether visceral progression per PCWG3/RECIST 1.1 criteria
      has been documented. Measurable visceral lesions ≥1.0 cm in longest dimension.
      Recorded separately by organ site.
  visceral_progression_date:
    type: string
    format: date
    description: Date on which visceral progression was first documented.
  visceral_progression_site:
    type: array
    items:
      type: string
    description: Organ site(s) of visceral progression, recorded separately per PCWG3.
  bone_progression_pcwg3:
    type: boolean
    description: 'Indicates whether bone progression per PCWG3 2+2 rule has been documented:
      ≥2 new lesions on first post-treatment scan, confirmed by ≥2 additional new
      lesions on the next scan. Date of progression = date of first post-treatment
      scan showing initial 2 new lesions.'
  bone_progression_date:
    type: string
    format: date
    description: Date of the first post-treatment scan on which ≥2 new bone lesions
      were initially documented per PCWG3 2+2 rule. This is the recorded date of progression
      even if confirmation occurs on a subsequent scan.
  bone_progression_confirmed_date:
    type: string
    format: date
    description: Date of the confirmatory scan on which ≥2 additional new bone lesions
      were documented, fulfilling the PCWG3 2+2 rule.
  bone_scan_flare:
    type: boolean
    description: Indicates whether a bone scan flare was identified on the first post-treatment
      scan (new lesions on first follow-up scan not confirmed on subsequent scan)
      per PCWG3. Flare should not be recorded as progression.
  bone_progression_criteria_used:
    type: string
    description: Specifies the bone progression criteria applied. In ¹⁷⁷Lu-PSMA studies,
      PSMA-PET/CT or post-therapy SPECT/CT may serve as primary bone imaging modality
      rather than conventional 99mTc bone scintigraphy.
  mixed_response:
    type: boolean
    description: 'Indicates whether a mixed response was observed: simultaneous favorable
      change in one site and unfavorable change in another. Per PCWG3, the disease
      should be assessed as a whole rather than on the basis of index lesions alone.'
  mixed_response_sites:
    type: string
    description: Description of sites showing divergent responses in cases of mixed
      response, specifying which site(s) responded and which progressed.
  overall_treatment_response_category:
    type: string
    description: Composite overall response integrating PSA response, radiographic
      response, and clinical status. Captures patients with discordant PSA/imaging
      responses, which are common in ¹⁷⁷Lu-PSMA RPT.
  psa_imaging_concordance:
    type: string
    description: Indicates concordance or discordance between PSA progression and
      radiographic progression at time of treatment discontinuation. Discordance (e.g.,
      PSA rise with stable imaging) is clinically relevant in ¹⁷⁷Lu-PSMA RPT.
  recip_response:
    type: string
    description: Original response label from the source (CMR/PMR/SMD/PMD/NE); pair
      with criteria_name/version and canonical recip_category. Do not treat SUV change
      alone as RECIP response.
  recip_response_date:
    type: string
    format: date
    description: Date of the PSMA-PET scan used for RECIP 1.0 response assessment.
  psma_pet_response_date:
    type: string
    description: Date of response under the explicitly named PET criteria. Uptake
      change alone does not establish RECIP response.
    format: date
  psma_pet_progression_date:
    type: string
    description: Date of PET progression under the named criteria. RECIP-PD requires
      both the specified whole-body volume increase and new lesions; do not apply
      an OR rule.
    format: date
  psma_expression_change_percent:
    type: number
    description: Percentage change in a prespecified PSMA PET uptake metric (for example

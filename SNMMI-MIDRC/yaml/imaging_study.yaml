required:
- submitter_id
- type
- cases
- datasets
submittable: true
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
title: Imaging Study
type: object
uniqueKeys:
- - id
- - project_id
  - submitter_id
validators: null

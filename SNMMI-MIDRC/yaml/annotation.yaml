              source: NCIt
              term: Universally Unique Identifier
              term_url: https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI_Thesaurus&version=16.02d&ns=NCI_Thesaurus&code=C54100
          type: string
        submitter_id:
          type: string
      type: object
    description: The submitter_id or id of the annotation_file this annotation relates
      to, i.e., a link to a record in the parent node.
  annotation_long_name:
    description: The long name of the annotation provides more information about the
      specific annotation.
    type: string
  annotation_method:
    description: Defines the method by which the annotation was created. Clinically_derived
      - Based on information produced in the process of the subject's medical care;
      Retrospective_expert - Based on information produced retrospective to the subject's
      care by annotators with relevant special clinical expertise; Retrospective_general
      - Based on information produced retrospective to the subject's care by annotators
      without relevant special clinical expertise; Retrospective_auto - Based on information
      produced retrospective to the subject's care using automated means.
    enum:
    - Clinically_derived
    - Retrospective_expert
    - Retrospective_general
    - Retrospective_auto
  annotation_name:
    enum:
    - midrc_bpr_landmarks
    - midrc_bpr_regions
    - midrc_lung_segs
    - midrc_lung_measures
    - midrc_mdai_chestxr
    - midrc_mRALE_Mastermind_Challenge
    - SIFT
    - NMMI_PSMA_SEGMENTATION
    - NMMI_PSMA_DOSE_MAP
    term:
      description: 'The name of the annotation. These names are unique and assigned
        by MIDRC. Annotation names reference a document posted on the MIDRC website
        describing the annotation, methods and values expected.  All MIDRC created
        annotations start with "midrc_".

        '
      termDef:
        cde_id: null
        cde_version: null
        source: MIDRC
        term: Annotation Name
        term_url: https://www.midrc.org/annotations
  annotator_id:
    description: Coded value to represent a particular annotator in a group. These
      need only be unique per annotation.
    type: string
  case_ids:

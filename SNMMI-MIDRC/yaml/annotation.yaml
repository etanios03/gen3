  class_covid19_pneumonia:
    description: Values are extracted from the annotation file midrc_mdai_chestxr;
      Accepted values include "typical" appearance, which is multifocal bilateral,
      peripheral opacities, or opacities with rounded morphology, lower lung-predominant
      distribution;  "indeterminate" appearance, which is absence of typical findings
      and unilateral, central or upper lung predominant distribution of airspace disease;
      "atypical" appearance, which is pneumothorax or pleural effusion, pulmonary
      edema, lobar consolidation, solitary lung nodule, or mass diffuse tiny nodules
      cavity; "negative" for pneumonia, which is no lung opacities.
    enum:
    - atypical
    - indeterminate
    - negative
    - typical

$schema: http://json-schema.org/draft-04/schema#
additionalProperties: false
category: annotation
description: Information describing characteristics of imaging studies, series and
  instances (e.g., segmentations, bounding boxes, feature labels) and inferences based
  on those characteristics (e.g., predicted diagnoses). Annotations may be recorded
  in the course of clinical care or retrospectively for purposes of research (e.g.,
  imaging annotations from PACS or retrospective labeling tools). Please refer to
  https://midrc.org/annotations to learn more about a particular batch of annotations.

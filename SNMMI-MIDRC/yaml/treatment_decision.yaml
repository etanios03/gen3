  decision_type:
    type: string
    description: Decision made at this assessment; completion and NLCB are separate
      values.
    enum:
    - start
    - continue
    - hold
    - modify
    - stop
    - complete_planned_course
    - nlcb
    - focal_therapy
    - retreat
    - other
  decision_datetime:
    type: string
    description: Date/time of decision, distinct from first progression and actual
      treatment administration.
    format: date-time
  rationale:
    type: string
    description: Documented rationale.
  decision_maker_role:
    type: string
    description: Documented decision maker role.
  benefit_assessment:
    type: string
    description: Documented benefit assessment.
  nlcb_reason:
    type: string
    description: Specific reason(s) why ¹⁷⁷Lu-PSMA RPT was ultimately discontinued,
      representing the No Longer Clinically Benefiting determination. More granular
      than Reason_For_Discontinuation_Lu177.
  nlcb_date:
    type: string
    description: Date of an explicit NLCB determination, not automatically the date
      of progression or planned completion.
    format: date
  continued_beyond_progression:
    type: boolean
    description: Indicates whether ¹⁷⁷Lu-PSMA RPT was continued after first documented
      biochemical or imaging progression, with rationale and subsequent benefit assessment.
  focal_therapy_for_oligoprogression:
    type: boolean
    description: Indicates whether focal therapy was delivered for oligoprogressive
      disease while systemic ¹⁷⁷Lu-PSMA RPT benefit was considered ongoing.
  dose_limiting_organ:
    type: string
    description: Organ identified in the recorded treatment-modification decision.
      Not an outcome or a universal tolerance rule.

$schema: http://json-schema.org/draft-04/schema#
id: surgery
title: surgery
type: object
namespace: https://link-to-data-portal/
category: medical_history
program: '*'
project: '*'
description: surgery before or after PRT therapy
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- node_id
- cases
- submitter_id
- type
links: []
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  node_id:
    type: string
    description: node_id of the node in the data model
  cases:
    description: submitter_id of the case this condition describes
    enum:
    - array
    - object
  case_ids:
    type: array
    items:
      type: string
    description: a list of one more more case submitter_ids associated with the data
  date_of_surgery:
    $ref: _definitions.yaml#/datetime
  primary_tumor_removal:
    type: boolean
    description: if the tumor has been removed through surgery
  time_between_PRT_surgery:
    type: integer
    description: time between the surgery event and the start of PRT treatment
  pre_tumor_volume:
    type: number
    description: tumor volume pre surgery, if debulking surgery was performed
  post_tumor_volume:
    type: number
    description: tumor volume post surgery, if debulking surgery was performed
  debulking_threshold:
    type: number
    description: the goal optimal debulking threshold, depending on the cancer type.
      Often around 0.7 for NETs
additionalProperties: false

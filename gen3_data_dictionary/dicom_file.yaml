$schema: http://json-schema.org/draft-04/schema#
id: dicom_file
title: dicom_file
type: object
namespace: https://link-to-data-portal/
category: data_file
program: '*'
project: '*'
description: DICOM file information and parameters per study
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- node_id
- submitter
- series_uid
- series_description
- modality
- md5sum
- imaging_studies
- file_size
- file_name
- annotation_format
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: imaging_studys
    backref: dicom_files
    label: part_of
    target_type: imaging_study
    multiplicity: many_to_one
    required: true
  - name: core_metadata_collections
    backref: dicom_files
    label: part_of
    target_type: core_metadata_collection
    multiplicity: one_to_one
    required: false
properties:
  $ref: _definitions.yaml#/data_file_properties
  node_id:
    type: string
    description: node id of the node
  submitter:
    type: string
    description: human-readable, unique identifier for a record in the database
  series_uid:
    type: string
    description: series instance UID, unique to the imaging series
  series_description:
    type: string
    description: general description/information about the imaging
  modality:
    description: modality
    enum:
    - PET
    - CT
    - SPECT
    - MRI
  md5sum:
    type: string
    description: 128 bit hash val expressed as hex number, file's digital footprint
  imaging_studies:
    type: array
    items:
      type: string
    description: submitter id or id of the imaging study
  file_size:
    type: integer
    description: size of the data file in bytes
  file_name:
    type: string
    description: name of file
  annotation_format:
    type: string
    description: file format of the annotation file (example, json)
  annotation_method:
    description: Defines the method by which the annotation was created. Clinically_derived
      - Based on information produced in the process of the subject's medical care;
      Retrospective_expert - Based on information produced retrospective to the subject's
      care by annotators with relevant special clinical expertise; Retrospective_general
      - Based on information produced retrospective to the subject's care by annotators
      without relevant special clinical expertise; Retrospective_auto - Based on information
      produced retrospective to the subject's care using automated means.
    enum:
    - Clinically_derived
    - Retrospective_expert
    - Retrospective_general
    - Retrospective_auto
  manufacturer:
    type: string
    description: manufacturer of model
  manufacturer_model_name:
    type: string
    description: model name of machine
  software_versions:
    type: string
    description: software version of application
  collimator:
    type: string
    description: type of collimator used for CT scnas
  attenuation_correction:
    type: string
    description: if correction used for PET or SPECT data
  convolution kernel:
    type: string
    description: describe the convolution kernel used in imaging
  imaging_studys:
    $ref: _definitions.yaml#/to_one
  core_metadata_collections:
    $ref: _definitions.yaml#/to_one
  data_category:
    description: Broad categorization of the contents of the data file.
    enum:
    - data_category_1
    - data_category_2
    - data_category_3
  data_format:
    description: The format of the data in this data file
    enum:
    - data_format_1
    - data_format_2
    - data_format_3
  data_type:
    description: The type of data in this data file
    enum:
    - data_type_1
    - data_type_2
    - data_type_3
additionalProperties: false

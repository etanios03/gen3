# aug 24, all the same as values_for_new_dict.yaml except with a smaller gitops 
# remove memory limits for ilyas large computer
global:
  dictionaryUrl: https://raw.githubusercontent.com/etanios03/gen3/refs/heads/main/aug24_gen3_data_dictionary/aug24_bundled_schema.json
  hostname: localhost
  dev: true
  postgres:
    dbCreate: true
    master:
      username: postgres
      password: postgres
      port: "5432"
  tls:
    enabled: false
  dataUploadBucket: gen3-data
  storage:
    type: minio

fence:
  enabled: true
  FENCE_CONFIG:
    MOCK_AUTH: true
    PUBLIC_URL: "http://localhost"
    ENABLED_IDENTITY_PROVIDERS:
      - mock
  usersync:
    userYamlS3Path: none
  USER_YAML: |
    users:
      etanios:
        email: etanios@uchicago.edu
        display_name: user1
        admin: true


sheepdog:
  enabled: true


indexd:
  enabled: true

  defaultPrefix: minio://gen3-data/

minio:
  enabled: true
  accessKey: minio
  secretKey: minio123
  buckets:
    - name: gen3-data
      policy: none
      purge: false

peregrine:
  enabled: true


revproxy:
  enabled: true


hatchery:
  enabled: false

portal:
  enabled: true

guppy:
  enabled: false
elasticsearch:
  enabled: false
wts:
  enabled: false
manifestservice:
  enabled: false
arborist:
  enabled: true
audit:
  enabled: false
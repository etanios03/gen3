# test file, development
# kubectl logs <node>
global:
  hostname: localhost
  dev: true
  dictionaryUrl: https://gen3-midrc-etanios03.s3.us-east-1.amazonaws.com/gen3_data_dictionary/gen3_bundled_schema.json
  postgres:
    dbCreate: true
    master:
      username: postgres
      password: postgres
      host: postgresql
      port: "5432"
  tls:
    enabled: false
  dataUploadBucket: gen3-data
  storage:
    type: minio

fence:
  enabled: true
  FENCE_CONFIG:
    MOCK_AUTH: true
    PUBLIC_URL: "http://localhost"
    ENABLED_IDENTITY_PROVIDERS:
      - mock
  usersync:
    userYamlS3Path: none
  USER_YAML: |
    users:
      etanios:
        email: etanios@uchicago.edu
        display_name: user1
        admin: true


sheepdog:
  enabled: true

indexd:
  enabled: true
  defaultPrefix: minio://gen3-data/

minio:
  enabled: true
  accessKey: minio
  secretKey: minio123
  buckets:
    - name: gen3-data
      policy: none
      purge: false

peregrine:
  enabled: true

revproxy:
  enabled: true

hatchery:
  enabled: true

portal:
  enabled: true
guppy:
  enabled: false
elasticsearch:
  enabled: false
wts:
  enabled: false
manifestservice:
  enabled: false
arborist:
  enabled: true
audit:
  enabled: false

localSecrets:
  fenceDbCreds:
    enabled: true
    username: postgres
    password: postgres
    host: postgresql
    database: postgres
    dbcreated: "true"
  sheepdogDbCreds:
    enabled: true
    username: postgres
    password: postgres
    host: postgresql
    database: postgres
    dbcreated: "true"
  peregrineDbCreds:
    enabled: true
    username: postgres
    password: postgres
    host: postgresql
    database: postgres
    dbcreated: "true"
  arboristDbCreds:
    enabled: true
    username: postgres
    password: postgres
    host: postgresql
    database: postgres
    dbcreated: "true"
  indexdDbCreds:
    enabled: true
    username: postgres
    password: postgres
    host: postgresql
    database: postgres
    dbcreated: "true"

